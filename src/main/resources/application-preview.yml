spring:
  datasource:
    url: jdbc:h2:mem:release_monitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/preview
  thymeleaf:
    cache: false

release-monitor:
  scheduling:
    enabled: false
