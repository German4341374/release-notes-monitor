name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify with PostgreSQL Testcontainers
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and start application
        run: docker compose up --build --detach

      - name: Wait for application health
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/health | grep '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify seeded dashboard and OpenAPI
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/dashboard | grep '"totalProducts":8'
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs | grep '"Release Notes Monitor API"'
          curl --fail --silent http://127.0.0.1:8080/ | grep 'Know what needs an upgrade'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Stop environment
        if: always()
        run: docker compose down --volumes --remove-orphans || true
